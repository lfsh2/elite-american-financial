<svg width="800" height="600" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">
  <!-- Dashboard mockup -->
  <rect width="800" height="600" fill="#f8fafc" rx="8" />
  
  <!-- Header bar -->
  <rect width="800" height="50" fill="#1e293b" rx="8" />
  <circle cx="25" cy="25" r="6" fill="#ef4444" />
  <circle cx="45" cy="25" r="6" fill="#f59e0b" />
  <circle cx="65" cy="25" r="6" fill="#10b981" />
  
  <!-- Sidebar -->
  <rect x="0" y="50" width="200" height="550" fill="#f1f5f9" />
  
  <!-- Sidebar items -->
  <rect x="20" y="80" width="160" height="40" fill="#2563eb" rx="6" />
  <text x="60" y="104" font-family="Arial" font-size="14" fill="white">Dashboard</text>
  
  <rect x="20" y="130" width="160" height="40" fill="#f1f5f9" rx="6" />
  <text x="60" y="154" font-family="Arial" font-size="14" fill="#64748b">Messages</text>
  
  <rect x="20" y="180" width="160" height="40" fill="#f1f5f9" rx="6" />
