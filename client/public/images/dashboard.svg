  <rect x="20" y="230" width="160" height="40" fill="#f1f5f9" rx="6" />
  <text x="60" y="254" font-family="Arial" font-size="14" fill="#64748b">Phone Numbers</text>
  
  <rect x="20" y="280" width="160" height="40" fill="#f1f5f9" rx="6" />
