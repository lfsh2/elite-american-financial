  <!-- Content area -->
  <rect x="220" y="70" width="560" height="100" fill="white" rx="8" />
  <text x="250" y="110" font-family="Arial" font-size="24" font-weight="bold" fill="#0f172a">Welcome to Textflow.ai</text>
  <text x="250" y="140" font-family="Arial" font-size="14" fill="#64748b">Your communication platform is ready</text>

  <!-- Stat cards -->
  <rect x="220" y="190" width="175" height="120" fill="white" rx="8" />
  <text x="240" y="220" font-family="Arial" font-size="12" fill="#64748b">Messages Sent</text>
  <text x="240" y="250" font-family="Arial" font-size="28" font-weight="bold" fill="#0f172a">5,234</text>
  <circle cx="350" cy="230" r="25" fill="#dbeafe" />
  <text x="240" y="280" font-family="Arial" font-size="12" fill="#22c55e">+12% this week</text>
  
  <rect x="410" y="190" width="175" height="120" fill="white" rx="8" />
  <text x="430" y="220" font-family="Arial" font-size="12" fill="#64748b">Active Users</text>
  <text x="430" y="250" font-family="Arial" font-size="28" font-weight="bold" fill="#0f172a">1,423</text>
  <circle cx="540" cy="230" r="25" fill="#ede9fe" />
  <text x="430" y="280" font-family="Arial" font-size="12" fill="#22c55e">+8% this week</text>
  
  <rect x="600" y="190" width="175" height="120" fill="white" rx="8" />
  <text x="620" y="220" font-family="Arial" font-size="12" fill="#64748b">Delivery Rate</text>
  <text x="620" y="250" font-family="Arial" font-size="28" font-weight="bold" fill="#0f172a">99.7%</text>
  <circle cx="730" cy="230" r="25" fill="#dcfce7" />
  <text x="620" y="280" font-family="Arial" font-size="12" fill="#22c55e">+0.3% this week</text>
  
  <!-- Chart area -->
  <rect x="220" y="330" width="360" height="250" fill="white" rx="8" />
  <text x="240" y="360" font-family="Arial" font-size="16" font-weight="bold" fill="#0f172a">Activity Over Time</text>
  
  <!-- Chart bars -->
  <rect x="260" y="400" width="20" height="140" fill="#dbeafe" rx="4" />
  <rect x="290" y="440" width="20" height="100" fill="#dbeafe" rx="4" />
  <rect x="320" y="380" width="20" height="160" fill="#dbeafe" rx="4" />
  <rect x="350" y="420" width="20" height="120" fill="#dbeafe" rx="4" />
  <rect x="380" y="400" width="20" height="140" fill="#dbeafe" rx="4" />
  <rect x="410" y="360" width="20" height="180" fill="#2563eb" rx="4" />
  <rect x="440" y="400" width="20" height="140" fill="#dbeafe" rx="4" />
  <rect x="470" y="430" width="20" height="110" fill="#dbeafe" rx="4" />
  <rect x="500" y="390" width="20" height="150" fill="#dbeafe" rx="4" />
  <rect x="530" y="410" width="20" height="130" fill="#dbeafe" rx="4" />
  
  <!-- Recent activity -->
  <rect x="600" y="330" width="175" height="250" fill="white" rx="8" />
  <text x="620" y="360" font-family="Arial" font-size="16" font-weight="bold" fill="#0f172a">Recent Activity</text>
  
  <circle cx="620" cy="395" r="6" fill="#2563eb" />
  <text x="635" y="400" font-family="Arial" font-size="12" fill="#64748b">New campaign created</text>
  
  <circle cx="620" cy="425" r="6" fill="#2563eb" />
  <text x="635" y="430" font-family="Arial" font-size="12" fill="#64748b">850 SMS sent</text>
  
  <circle cx="620" cy="455" r="6" fill="#2563eb" />
  <text x="635" y="460" font-family="Arial" font-size="12" fill="#64748b">New number purchased</text>
  
  <circle cx="620" cy="485" r="6" fill="#2563eb" />
  <text x="635" y="490" font-family="Arial" font-size="12" fill="#64748b">Workflow updated</text>
  
  <circle cx="620" cy="515" r="6" fill="#2563eb" />
  <text x="635" y="520" font-family="Arial" font-size="12" fill="#64748b">API key created</text>
