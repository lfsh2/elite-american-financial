# Render Blueprint for TextFlow / Elite Financial
# https://render.com/docs/blueprint-spec
#
# SCALING NOTES FOR 100K+ CONTACTS:
# - Use "starter" or "standard" plan for production (not free)
# - Database: Use Neon Pro or Supabase Pro for connection pooling
# - Redis: Use Upstash Pro for higher throughput
# - Consider background worker for batch processing

services:
  # Main Web Service
  - type: web
    name: textflow
    runtime: node
    region: oregon # or ohio, frankfurt, singapore
    plan: starter # IMPORTANT: Use starter/standard for 100k+ contacts (free has memory limits)
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    # Scaling settings for large workloads
    numInstances: 1 # Increase to 2-3 for high traffic
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=512" # Increase memory for large imports
      - key: DATABASE_URL
        sync: false # Set manually in Render dashboard
      - key: REDIS_URL
        sync: false # Set manually - use Upstash free tier
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_PHONE_NUMBERS
        sync: false
      - key: SENDGRID_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
